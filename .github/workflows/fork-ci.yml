# Fork CI (mazeyboi/noop). The fork owns .github/workflows and .github/fork; upstream's own
# workflows are not used here (see FORK.md). This runs on every push and PR:
#   - the fork's script tests and actionlint (cheap, Linux)
#   - every Swift package's tests, discovered from Packages/*, so new upstream packages and
#     Packages/NOOPExtras are covered without editing this file.
name: Fork CI

on:
  push:
    branches: [main, 'fork/**', 'extras/**']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
      - name: Script tests
        run: bash .github/fork/tests/run-all.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color -config-file .github/fork/actionlint.yaml
      - id: discover
        run: echo "packages=$(bash .github/fork/scripts/list-packages.sh)" >> "$GITHUB_OUTPUT"

  packages:
    needs: scripts
    # extras/** branches iterate on Packages/NOOPExtras only (the jobs below); main and PRs run everything.
    if: ${{ !startsWith(github.ref, 'refs/heads/extras/') }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.scripts.outputs.packages) }}
    steps:
      - uses: actions/checkout@v5
      - name: Test ${{ matrix.package }}
        run: swift test
        working-directory: Packages/${{ matrix.package }}

  # The fork's own package: unit tests on macOS, plus an iOS compile of the UI target (which is
  # iOS-only code and so is not compiled by `swift test`).
  extras-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: swift test (NOOPExtras)
        working-directory: Packages/NOOPExtras
        run: |
          swift test > /tmp/extras-test.log 2>&1 && { grep -E "Executed|passed|failed" /tmp/extras-test.log | tail -5; exit 0; }
          grep -E "error:|failed|XCTAssert" /tmp/extras-test.log | head -120
          tail -30 /tmp/extras-test.log
          exit 1

  extras-ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build NOOPExtrasUI for iOS
        working-directory: Packages/NOOPExtras
        run: |
          xcodebuild -scheme NOOPExtrasUI -destination 'generic/platform=iOS' -derivedDataPath /tmp/dd             CODE_SIGNING_ALLOWED=NO build > /tmp/extras-ios.log 2>&1 && { tail -3 /tmp/extras-ios.log; exit 0; }
          grep -E "error:" /tmp/extras-ios.log | sort -u | head -120
          tail -30 /tmp/extras-ios.log
          exit 1
